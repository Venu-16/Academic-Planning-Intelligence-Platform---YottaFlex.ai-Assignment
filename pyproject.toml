[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "academic-planner"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "ortools>=9.10,<10", "streamlit>=1.35,<2", "plotly>=5.20,<7", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.1,<4", "PyYAML>=6,<7", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<9"]
[project.scripts]
academic-planner = "academic_planner.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
