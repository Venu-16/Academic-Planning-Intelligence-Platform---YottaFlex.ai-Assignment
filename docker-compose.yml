services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: academic_planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports: ["5432:5432"]
    volumes: [academic_planner_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d academic_planner"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  academic_planner_pgdata:
